name: Daily sector snapshot
on:
  schedule:
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build-snapshot.mjs'
      - '.github/workflows/daily-snapshot.yml'
permissions:
  contents: write
concurrency:
  group: daily-sector-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync with latest main before building
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Build T-1 to T-10 snapshot
        run: node scripts/build-snapshot.mjs
      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep only the files generated by the snapshot builder.
          # Do not stage low-base.json: it is a separate quote-fallback data file.
          mkdir -p /tmp/daily-snapshot
          cp public/mapping.json /tmp/daily-snapshot/mapping.json
          cp public/rank-history.json /tmp/daily-snapshot/rank-history.json

          if git diff --quiet -- public/mapping.json public/rank-history.json; then
            exit 0
          fi

          # Rebase conflicts used to happen here when low-base.json was also
          # part of the generated commit. Start from the latest main instead
          # and restore only the two files this job actually generates.
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/daily-snapshot/mapping.json public/mapping.json
          cp /tmp/daily-snapshot/rank-history.json public/rank-history.json

          git add public/mapping.json public/rank-history.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update daily sector rank snapshot"
          git push origin HEAD:main
