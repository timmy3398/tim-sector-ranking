name: Daily sector snapshot
on:
  schedule:
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build-snapshot.mjs'
      - '.github/workflows/daily-snapshot.yml'
permissions:
  contents: write
concurrency:
  group: daily-sector-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build T-1 to T-10 snapshot
        run: node scripts/build-snapshot.mjs
      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/mapping.json public/rank-history.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update daily sector rank snapshot"
          git pull --rebase origin main
          git push origin HEAD:main
