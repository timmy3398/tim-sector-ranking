name: Quote health check
on:
  push:
    branches: [main]
    paths:
      - 'src/worker.js'
      - 'public/mapping.json'
      - '.github/workflows/quote-health.yml'
  workflow_dispatch:
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check src/worker.js
      - name: Wait for Cloudflare Git deployment
        run: sleep 60
      - name: Compare live quotes with official TWSE/TPEx
        env:
          WORKER_URL: https://tim-sector-ranking.timmy3398.workers.dev
        run: |
          node <<'NODE'
          const fs = require('fs');
          const mapping = JSON.parse(fs.readFileSync('public/mapping.json','utf8'));
          const codes = [...new Set(Object.values(mapping).flat().filter(c => /^\d{4}$/.test(String(c))))];
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          async function get(url){
            const r = await fetch(url,{headers:{'user-agent':'Mozilla/5.0','accept':'application/json,text/plain,*/*'}});
            if(!r.ok) throw new Error(r.status+' '+url);
            return r.json();
          }
          function codeOf(x){return String(x.Code ?? x.SecuritiesCompanyCode ?? '').trim()}
          function num(v){if(v==null||v===''||v==='-')return null;const n=Number(String(v).replaceAll(',',''));return Number.isFinite(n)?n:null}
          (async()=>{
            const [tw,ot] = await Promise.all([
              get('https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL'),
              get('https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes')
            ]);
            const official = new Map();
            for(const x of tw){const c=codeOf(x);if(/^\d{4}$/.test(c)) official.set(c,{close:num(x.ClosingPrice),value:num(x.TradeValue ?? x.TransactionAmount ?? x.TransactionValue)})}
            for(const x of ot){const c=codeOf(x);if(/^\d{4}$/.test(c)) official.set(c,{close:num(x.ClosingPrice ?? x.Close ?? x.ClosePrice),value:num(x.TradeValue ?? x.TransactionAmount ?? x.TransactionValue)})}
            const missingOfficial = codes.filter(c=>!official.has(c));
            if(missingOfficial.length) throw new Error('Official source missing mapped codes: '+missingOfficial.slice(0,20).join(','));
            const live = new Map();
            for(let i=0;i<codes.length;i+=80){
              const batch=codes.slice(i,i+80).join(',');
              const data=await get(process.env.WORKER_URL+'/api/quotes?codes='+batch+'&v='+process.env.GITHUB_SHA);
              if(!data.ok) throw new Error('Worker API ok=false');
              for(const [c,q] of Object.entries(data.quotes||{})) live.set(c,q);
              await sleep(150);
            }
            const missingLive = codes.filter(c=>!live.has(c));
            if(missingLive.length) throw new Error('Worker missing mapped quotes: '+missingLive.slice(0,20).join(',')+' (total '+missingLive.length+')');
            const bad=[];
            for(const c of codes){
              const o=official.get(c), q=live.get(c);
              if(o.close!=null && q.close!=null && Number(q.close)!==Number(o.close)) bad.push(c+' close '+q.close+' != '+o.close);
              if(o.value!=null && q.value!=null && Number(q.value)!==Number(o.value)) bad.push(c+' value '+q.value+' != '+o.value);
              if(q.close==null || q.value==null || Number(q.close)<=0 || Number(q.value)<=0) bad.push(c+' invalid quote '+JSON.stringify(q));
            }
            if(bad.length) throw new Error('Quote mismatches: '+bad.slice(0,30).join(' | ')+' (total '+bad.length+')');
            console.log('PASS: '+codes.length+' mapped stocks match official TWSE/TPEx close/value data.');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
